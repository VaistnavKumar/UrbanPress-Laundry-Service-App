services:
  # ── Monolithic Backend Service (100% Free Tier) ────────────────────────────
  - type: web
    name: api-gateway
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: Dockerfile
    envVars:
      # Nginx listening port
      - key: PORT
        value: "5000"
      # Cloud-managed free database connection URLs
      - key: DATABASE_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        sync: false
      # Microservice secrets
      - key: JWT_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
