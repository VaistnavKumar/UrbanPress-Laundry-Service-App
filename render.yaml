services:
  # ── Databases ──────────────────────────────────────────────────────────────
  # Managed PostgreSQL Database
  - type: db
    name: urbanpress-postgres
    plan: free
    ipAllowList: [] # Allows internal and external secure connections

  # Managed Redis Cache
  - type: redis
    name: urbanpress-redis
    plan: free
    ipAllowList: []

  # MongoDB Instance (runs as a private service)
  - type: pservice
    name: mongodb
    env: docker
    dockerImage: mongo:6-jammy
    disk:
      name: mongodb-data
      mountPath: /data/db
      sizeGB: 1

  # ── Background Worker Microservices ────────────────────────────────────────
  # Notification Service
  - type: worker
    name: notification-service
    env: docker
    dockercontext: ./backend
    dockerfile: services/notification-service/Dockerfile
    envVars:
      - key: REDIS_URL
        fromRedis:
          name: urbanpress-redis
          property: connectionString
      - key: RESEND_API_KEY

  # ── Private Microservices ──────────────────────────────────────────────────
  # Auth Service
  - type: pservice
    name: auth-service
    env: docker
    dockercontext: ./backend
    dockerfile: services/auth-service/Dockerfile
    ports:
      - key: PORT
        value: 5001
    envVars:
      - key: PORT
        value: 5001
      - key: DATABASE_URL
        fromDatabase:
          name: urbanpress-postgres
          property: connectionString
      - key: JWT_SECRET
        generate: true

  # Booking Service
  - type: pservice
    name: booking-service
    env: docker
    dockercontext: ./backend
    dockerfile: services/booking-service/Dockerfile
    ports:
      - key: PORT
        value: 5002
    envVars:
      - key: PORT
        value: 5002
      - key: DATABASE_URL
        fromDatabase:
          name: urbanpress-postgres
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: urbanpress-redis
          property: connectionString

  # Order Service
  - type: pservice
    name: order-service
    env: docker
    dockercontext: ./backend
    dockerfile: services/order-service/Dockerfile
    ports:
      - key: PORT
        value: 5003
    envVars:
      - key: PORT
        value: 5003
      - key: DATABASE_URL
        fromDatabase:
          name: urbanpress-postgres
          property: connectionString
      - key: MONGO_URI
        value: mongodb://mongodb:27017/urbanpress_garments

  # Payment Service
  - type: pservice
    name: payment-service
    env: docker
    dockercontext: ./backend
    dockerfile: services/payment-service/Dockerfile
    ports:
      - key: PORT
        value: 5004
    envVars:
      - key: PORT
        value: 5004
      - key: DATABASE_URL
        fromDatabase:
          name: urbanpress-postgres
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: urbanpress-redis
          property: connectionString
      - key: RAZORPAY_KEY_ID
      - key: RAZORPAY_KEY_SECRET

  # ── Public API Gateway ─────────────────────────────────────────────────────
  # Nginx Gateway
  - type: web
    name: api-gateway
    env: docker
    dockercontext: ./backend
    dockerfile: api-gateway/Dockerfile
    ports:
      - key: PORT
        value: 5000
    envVars:
      - key: PORT
        value: 5000
