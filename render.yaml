databases:
  - name: urbanpress-postgres
    plan: free
    ipAllowList: []

services:
  # ── Private Database Cache Services ────────────────────────────────────────
  # Managed Redis Cache (Render native Key Value store)
  - type: keyvalue
    name: urbanpress-redis
    plan: free
    ipAllowList: []

  # MongoDB Instance (runs as a private service)
  - type: pserv
    name: mongodb
    runtime: image
    image:
      url: mongo:6-jammy
    disk:
      name: mongodb-data
      mountPath: /data/db
      sizeGB: 1

  # ── Background Worker Microservices ────────────────────────────────────────
  # Notification Service
  - type: worker
    name: notification-service
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: services/notification-service/Dockerfile
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: urbanpress-redis
          property: connectionString
      - key: RESEND_API_KEY
        sync: false

  # ── Private Microservices ──────────────────────────────────────────────────
  # Auth Service
  - type: pserv
    name: auth-service
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: services/auth-service/Dockerfile
    envVars:
      - key: PORT
        value: "5001"
      - key: DATABASE_URL
        fromDatabase:
          name: urbanpress-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  # Booking Service
  - type: pserv
    name: booking-service
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: services/booking-service/Dockerfile
    envVars:
      - key: PORT
        value: "5002"
      - key: DATABASE_URL
        fromDatabase:
          name: urbanpress-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: urbanpress-redis
          property: connectionString

  # Order Service
  - type: pserv
    name: order-service
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: services/order-service/Dockerfile
    envVars:
      - key: PORT
        value: "5003"
      - key: DATABASE_URL
        fromDatabase:
          name: urbanpress-postgres
          property: connectionString
      - key: MONGO_URI
        value: mongodb://mongodb:27017/urbanpress_garments

  # Payment Service
  - type: pserv
    name: payment-service
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: services/payment-service/Dockerfile
    envVars:
      - key: PORT
        value: "5004"
      - key: DATABASE_URL
        fromDatabase:
          name: urbanpress-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: urbanpress-redis
          property: connectionString
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  # ── Public API Gateway ─────────────────────────────────────────────────────
  # Nginx Gateway
  - type: web
    name: api-gateway
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: api-gateway/Dockerfile
    envVars:
      - key: PORT
        value: "5000"
