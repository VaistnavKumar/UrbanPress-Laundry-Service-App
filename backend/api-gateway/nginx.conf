worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Rate limiting zone (10r/s per client IP)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    server {
        # start.sh replaces this port via sed with Render's $PORT at runtime
        listen 5000;
        server_name _;

        # ── Global CORS headers ──────────────────────────────────────────────
        # Handle all preflight OPTIONS requests globally
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            return 204;
        }

        # Forward headers for microservices
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── Auth endpoints ───────────────────────────────────────────────────
        location /api/auth {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://127.0.0.1:5001;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
        }

        # ── Booking & Slot endpoints ─────────────────────────────────────────
        location /api/booking {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://127.0.0.1:5002;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
        }
        location /api/slots {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://127.0.0.1:5002;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
        }

        # ── Order endpoints ──────────────────────────────────────────────────
        location /api/orders {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://127.0.0.1:5003;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
        }

        # ── Payment endpoints ────────────────────────────────────────────────
        location /api/payments {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://127.0.0.1:5004;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
        }

        # ── Health Check — Render pings this to verify container is alive ────
        location /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK";
        }

        # ── Root fallback ────────────────────────────────────────────────────
        location / {
            add_header Content-Type application/json;
            add_header 'Access-Control-Allow-Origin' '*' always;
            return 200 '{"status":"UrbanPress API Gateway Running"}';
        }
    }
}
